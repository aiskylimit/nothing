[project]
name = "sql_distill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.12"


dependencies = [
    "accelerate==1.13.0",
    "datasets",
    "huggingface-hub",
    "peft==0.18.1",
    "transformers==4.57.3",
    "trl==0.21.0",
    "typer>=0.15.2",
    "wandb",
    "yq>=3.4.3",
    "deepspeed",
    "matplotlib",
    "nltk",
    "numerize",
    "numpy",
    "pandas",
    "torch==2.9.1",
    "tqdm",
    "rouge-score",
    "rich",
    "setuptools",
    "sqlparse",
    "func-timeout",
    "jieba",
    "jsonlines",
    "PyMySQL",
    "pytest",
    "rouge-chinese",
    "safetensors",
    "scikit-learn",
    "tiktoken"
]

[project.optional-dependencies]
vllm = [
    "vllm"
]

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"
