[project]
name = "tis-dpo"
version = "0.1.0"
requires-python = "==3.9.*"
dependencies = [
    "torch>=2.1.0",
    "torchvision",
    "numpy",
    "transformers>=4.31.0",
    "datasets>=2.12.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "tqdm>=4.65.0",
    "accelerate>=0.20.3",
    "bs4>=0.0.1",
    "beautifulsoup4>=4.12.2",
    "tensor-parallel>=1.3.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.23.3",
    "fschat[model_worker,webui]",
    "vllm",
    "lm-eval[vllm]",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"