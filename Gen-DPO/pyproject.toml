[project]
name = "tis-dpo"
version = "0.1.0"
requires-python = ">=3.9,<3.10"

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.31.0",
    "datasets>=2.12.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "wandb>=0.15.4",
    "tqdm>=4.65.0",
    "accelerate>=0.20.3",
    "beautifulsoup4>=4.12.2",
    "tensor-parallel>=1.3.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.23.3",
    "fschat[model_worker,webui]",
    "numpy",
    "setuptools<81"
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
