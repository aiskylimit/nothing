[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvsd"
version = "0.1.0"
description = "PVSD: Privilege Vector Self-Distillation (with the AVSD baseline it builds on)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Duy Nguyen" },
]
dependencies = [
  "accelerate",
  "bitsandbytes",
  "datasets",
  "deepspeed",
  "einops",
  "math-verify",
  "peft",
  "safetensors",
  "sentencepiece",
  "tiktoken",
  "torch",
  "transformers",
  "trl",
  "vllm",
  "xformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
