[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvsd"
version = "0.1.0"
description = "PVSD: Privilege Vector Self-Distillation (with the AVSD baseline it builds on)."
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "Apache-2.0" }
authors = [
  { name = "Duy Nguyen" },
]
dependencies = [
  "accelerate==1.11.0",
  "datasets==3.6.0",
  "einops==0.8.1",
  "jinja2>=3.1,<4",
  "math-verify==0.8.0",
  "peft==0.17.1",
  "safetensors==0.5.3",
  "sentencepiece==0.1.99",
  "tiktoken==0.9.0",
  "torch==2.8.0",
  "tqdm>=4.66,<5",
  "transformers==4.57.1",
  "trl==0.26.0",
]

[project.optional-dependencies]
gpu = [
  "bitsandbytes==0.48.2; sys_platform == 'linux'",
  "deepspeed==0.18.2; sys_platform == 'linux'",
  "ninja>=1.11,<2; sys_platform == 'linux'",
  "packaging>=24,<26; sys_platform == 'linux'",
  "psutil>=5.9,<8; sys_platform == 'linux'",
  "setuptools>=68; sys_platform == 'linux'",
  "triton==3.4.0; sys_platform == 'linux'",
  "vllm==0.11.0; sys_platform == 'linux'",
  "wheel>=0.43; sys_platform == 'linux'",
  "xformers==0.0.32.post1; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
